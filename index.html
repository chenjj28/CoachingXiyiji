<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>洗衣机教练 · 成长陪伴台</title>
<style>
  :root{
    --bg:#F4F1EA;
    --surface:#FBFAF7;
    --brand:#27456C;
    --brand2:#3A587B;
    --mist:#D5DEE5;
    --accent:#C96F4A;
    --ink:#202322;
    --muted:#5f6b78;
    --line:#E2E0D8;
    --tint-brand:#EAF1F7;
    --tint-accent:#FBF1EA;
    --red:#C0392B;
    --radius:16px;
    --shadow:0 1px 3px rgba(39,69,108,.06),0 6px 20px rgba(39,69,108,.05);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
  .app{display:flex;min-height:100vh;max-width:1180px;margin:0 auto}

  /* ---------- Sidebar (PC) / Bottom tab (mobile) ---------- */
  .sidebar{width:208px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;color:var(--brand)}
  .brand .logo{width:48px;height:48px;border-radius:12px;background:transparent;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .brand .logo img{width:100%;height:100%;object-fit:contain}
  .brand .txt{font-weight:700;font-size:15px;line-height:1.25}
  .brand .txt small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.5px}
  .nav-btn{display:flex;align-items:center;gap:11px;border:none;background:transparent;color:var(--brand2);font-size:15px;font-family:var(--font);padding:12px 12px;border-radius:12px;cursor:pointer;text-align:left;min-height:44px;width:100%;transition:background .15s,color .15s}
  .nav-btn svg{width:20px;height:20px;flex-shrink:0}
  .nav-btn:hover{background:var(--mist)}
  .nav-btn.active{background:var(--tint-brand);color:var(--brand);font-weight:600}
  .side-foot{margin-top:auto;font-size:11px;color:var(--muted);padding:8px;line-height:1.5}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;padding:0 0 40px}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(244,241,234,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .topbar .top-logo{width:46px;height:46px;border-radius:12px;object-fit:contain;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .topbar h1{font-size:19px;margin:0;color:var(--brand);font-weight:700;flex:1;min-width:160px}
  .topbar h1 small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
  .tools{display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--brand2);font-family:var(--font);font-size:14px;padding:0 14px;min-height:44px;border-radius:11px;cursor:pointer;transition:background .15s,border-color .15s,transform .05s}
  .btn:hover{background:var(--mist)}
  .btn:active{transform:scale(.97)}
  .btn svg{width:17px;height:17px}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:#1d3453}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--red);border-color:#eccfc9}
  .btn.danger:hover{background:#fbeae7}
  .btn.sm{min-height:38px;padding:0 12px;font-size:13px}

  .wrap{padding:20px 22px 0;display:flex;flex-direction:column;gap:18px}

  /* ---------- Today ---------- */
  .today{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:var(--radius);padding:16px 18px 14px}
  .today .th{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;margin-bottom:10px;color:var(--brand)}
  .today .th svg{width:19px;height:19px}
  .today .th .pill{margin-left:auto;font-size:11px;background:var(--tint-accent);color:var(--accent);padding:3px 10px;border-radius:20px;font-weight:600}
  .td-item{background:transparent;border:none;border-top:1px solid var(--line);border-radius:0;padding:11px 0;display:flex;align-items:flex-start;gap:12px;color:var(--ink)}
  .td-item:first-of-type{border-top:none;padding-top:2px}
  .td-item:last-child{margin-bottom:0}
  .td-item.over{background:var(--tint-accent);border-left:4px solid var(--red);padding-left:12px;border-radius:8px}
  .td-item .ic{width:30px;height:30px;border-radius:9px;background:transparent;color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .td-item .ic svg{width:17px;height:17px}
  .td-item .body{flex:1;min-width:0}
  .td-item .body .t{font-weight:600;font-size:14px;color:var(--brand)}
  .td-item .body .d{font-size:12.5px;color:var(--ink);opacity:.9;margin-top:3px}
  .td-item .body .meta{font-size:12px;color:var(--muted);margin-top:4px}
  .td-item .body .cid{font-size:11px;color:var(--accent);margin-top:3px;font-weight:600}
  .td-item .act{flex-shrink:0;display:flex;flex-direction:column;gap:5px;align-items:stretch;width:84px}
  .td-item .act .btn{min-height:32px;padding:0 9px;font-size:12px;width:100%;justify-content:center}
  .td-item .act .btn:hover{background:var(--mist)}
  .today .empty{font-size:13.5px;opacity:.85;line-height:1.7}

  /* ---------- Card ---------- */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px}
  .card h2{font-size:17px;margin:0 0 4px;color:var(--brand);display:flex;align-items:center;gap:9px}
  .card h2 svg{width:20px;height:20px;color:var(--brand2)}
  .card .sub{font-size:13px;color:var(--muted);margin:0 0 16px}

  /* ---------- Filters ---------- */
  .filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .filters button{border:1px solid var(--line);background:var(--bg);color:var(--brand2);font-family:var(--font);font-size:13.5px;padding:8px 16px;border-radius:20px;cursor:pointer;min-height:40px}
  .filters button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .date-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .date-nav .dn-label{font-size:13px;color:var(--muted)}
  .date-nav .dn-clear{font-size:13px;color:var(--accent);background:transparent;border:none;cursor:pointer;min-height:34px;padding:0 6px}
  .date-nav .dn-count{margin-left:auto;font-size:12.5px;color:var(--muted)}
  .mh{flex:1 1 100%;margin-top:2px}
  .mh-inner{display:flex;flex-direction:column;gap:6px}
  .mh-row{display:flex;align-items:center;gap:8px}
  .mh-yr{font-size:13px;font-weight:700;color:var(--brand2);width:36px;flex-shrink:0;text-align:right}
  .mh-cells{display:flex;gap:5px;flex:1;min-width:0}
  .mh-cell{flex:1;min-width:0;min-height:36px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font);transition:border-color .12s,background .12s}
  .mh-cell .mn{font-size:11px;color:var(--muted);line-height:1.15}
  .mh-cell .mc{font-size:12.5px;font-weight:700;color:var(--brand);line-height:1.15}
  .mh-cell.lvl1{background:#DCE7F1;border-color:#DCE7F1}
  .mh-cell.lvl2{background:#AFC4DA;border-color:#AFC4DA}
  .mh-cell.lvl3{background:var(--brand);border-color:var(--brand)}
  .mh-cell.lvl3 .mn,.mh-cell.lvl3 .mc{color:#fff}
  .mh-cell.sel{outline:2px solid var(--accent);outline-offset:1px}
  .mh-cell:hover{border-color:var(--brand)}
  .mh-legend{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:11px;color:var(--muted)}
  .mh-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
  .mh-legend .s0{background:#E8E5DD}
  .mh-legend .s1{background:#DCE7F1}
  .mh-legend .s2{background:#AFC4DA}
  .mh-legend .s3{background:var(--brand)}

  /* ---------- Timeline ---------- */
  .timeline{position:relative;padding-left:26px;margin-top:6px}
  .timeline:before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--mist)}
  .tl-item{position:relative;margin-bottom:20px}
  .tl-item:last-child{margin-bottom:0}
  .tl-item:before{content:"";position:absolute;left:-22px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--brand);box-shadow:0 0 0 3px var(--bg)}
  .tl-item.sup:before{border-color:var(--accent)}
  .tl-card{border:1px solid var(--line);border-radius:14px;padding:15px 16px;background:#fff}
  .tl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .tl-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tl-date{font-size:13.5px;font-weight:600;color:var(--brand);background:var(--tint-brand);padding:4px 12px;border-radius:20px;line-height:1.4;white-space:nowrap}
  .tl-type{font-size:13.5px;font-weight:700;padding:4px 12px;border-radius:20px;border:1px solid;line-height:1.4;white-space:nowrap}
  .tl-type.coach{color:#fff;background:var(--brand);border-color:var(--brand)}
  .tl-type.supervise{color:#fff;background:var(--accent);border-color:var(--accent)}
  .tl-cid{font-size:12px;font-weight:600;color:var(--muted)}
  .tl-topic{font-size:16px;font-weight:700;color:var(--ink);flex:1;min-width:140px;align-self:center}
  .tl-row{display:flex;gap:9px;margin:9px 0;align-items:flex-start}
  .tl-row .lab{font-size:14.5px;font-weight:700;color:var(--brand2);flex-shrink:0;min-width:60px}
  .tl-row .val{font-size:14.5px;color:var(--ink);flex:1;min-width:0}
  .tl-row textarea{width:100%;font-size:15px;margin-top:4px}
  .btn.sm.act-toggle{margin-left:auto;flex-shrink:0;padding:0 13px;min-height:34px;font-size:13px}
  .tl-row .lab.muted{color:var(--muted);font-weight:600}
  .tl-row.sub{margin-left:14px;padding-left:12px;border-left:2px solid var(--line)}
  .act-row.done .lab{color:#2f7d5b}
  .act-row.pending .lab{color:var(--accent)}
  #sessionForm.client-mode [data-coach]{display:none}
  .ph{color:var(--muted);font-style:italic;opacity:.75}
  .follow .val{flex:1;min-width:0}
  .follow.block,.follow.testimonial{align-items:flex-start}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 0;padding-top:11px;border-top:1px solid var(--line)}
  .tag{font-size:12.5px;color:var(--accent);background:transparent;border:1px solid #F0D9C0;padding:3px 11px;border-radius:20px;font-weight:600}
  .follow{margin-top:11px;padding:11px 13px;border-radius:11px;background:transparent;border-left:3px solid var(--brand);font-size:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink)}
  .follow.done{border-left-color:#3a8f6f;color:#2f7d5b}
  .follow.pending{border-left-color:var(--accent);color:var(--accent)}
  .follow .ft{font-size:14px;font-weight:700;color:var(--brand2);flex-shrink:0}
  .follow .pd{margin-left:auto;font-size:12px;opacity:.8}
  .follow.block{background:transparent;border:1px dashed var(--line);border-left:3px dashed var(--muted);color:var(--muted);margin-top:6px}
  .follow.block .ft{color:var(--muted)}
  .follow.coach-note{background:transparent;border:1px dashed var(--line);border-left:3px dashed var(--brand2);color:var(--muted)}
  .follow.coach-note .ft{color:var(--brand2)}
  .follow.testimonial{background:var(--tint-accent);border:1px solid #F0D9C0;border-left:3px solid var(--accent);color:var(--accent)}
  .follow.testimonial .ft{color:var(--accent)}
  .tl-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .empty-state{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
  .empty-state .big{font-size:15px;color:var(--brand2);font-weight:600;margin-bottom:6px}

  /* ---------- Form ---------- */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--brand2);margin-bottom:6px}
  .field .hint{font-weight:400;color:var(--muted);font-size:12px}
  input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],textarea,select{width:100%;font-family:var(--font);font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  textarea{resize:vertical;min-height:74px;line-height:1.55}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(39,69,108,.12)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{flex:1;min-width:120px;min-height:46px;border:1px solid var(--line);background:var(--bg);border-radius:11px;font-size:15px;color:var(--brand2);cursor:pointer;font-family:var(--font);font-weight:600}
  .seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .form-actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}

  /* ---------- Overview ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:10px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 12px;text-align:center}
  .stat .n{font-size:21px;font-weight:800;color:var(--brand);line-height:1.15;white-space:nowrap}
  .stat .n .unit{font-size:13px;font-weight:600;margin-left:3px;color:var(--muted)}
  .stat .l{font-size:12px;color:var(--muted);margin-top:4px}
  .dist{font-size:13px;color:var(--brand2);margin:0 0 6px;font-weight:600}
  .dist .sup{color:var(--accent)}
  .ov-block{margin-top:6px}
  .ov-block .ttl{font-size:14px;font-weight:700;color:var(--brand2);margin:16px 0 10px;display:flex;align-items:center;gap:8px}
  .ov-block .ttl svg{width:17px;height:17px}
  .chart-wrap{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px}
  .chart-wrap svg{width:100%;height:auto;display:block}
  .kw-wrap{display:flex;flex-wrap:wrap;gap:8px}
  .kw{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);border:1px solid #F0D9C0;background:transparent;padding:4px 12px;border-radius:20px;font-weight:600}
  .kw b{font-weight:700;color:var(--accent);font-size:12px}

  .tip{background:var(--tint-accent);border:1px solid #F0D9C0;color:var(--accent);font-size:13px;padding:11px 14px;border-radius:12px;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start}
  .tip svg{width:17px;height:17px;flex-shrink:0;margin-top:2px}

  /* ---------- Modal ---------- */
  .modal-mask{position:fixed;inset:0;background:rgba(32,35,34,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-mask.show{display:flex}
  .modal{background:var(--surface);border-radius:16px;padding:22px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.2)}
  .modal h3{margin:0 0 8px;color:var(--brand);font-size:17px}
  .modal p{font-size:14px;color:var(--muted);margin:0 0 18px}
  .modal .row{display:flex;gap:10px;justify-content:flex-end}

  .hidden{display:none!important}

  /* ---------- Login ---------- */
  .login-mask{position:fixed;inset:0;background:linear-gradient(135deg,#27456C 0%,#3A587B 100%);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
  .login-card{background:var(--surface);border-radius:20px;padding:30px 26px;width:100%;max-width:366px;box-shadow:0 20px 60px rgba(0,0,0,.32)}
  .login-brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .login-brand .logo{width:84px;height:84px;border-radius:18px;background:transparent;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .login-brand .logo img{width:100%;height:100%;object-fit:contain}
  .login-brand .txt{font-weight:800;font-size:19px;color:var(--brand);line-height:1.2}
  .login-brand .txt small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.6px;margin-top:3px}
  .login-card h2{font-size:17px;margin:0 0 16px;color:var(--brand)}
  .login-card .field label{color:var(--brand2)}
  .login-card .btn{width:100%;justify-content:center;margin-top:6px}
  .login-err{color:var(--red);font-size:13px;margin-top:12px;min-height:18px;text-align:center;font-weight:600}
  .login-note{font-size:11.5px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.5}

  /* ---------- Client picker (coach) ---------- */
  .client-pick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .client-pick label{font-size:13px;color:var(--brand2);font-weight:600;white-space:nowrap}
  .client-pick input{font-family:var(--font);font-size:15px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:170px;flex:1}
  .client-pick select{font-family:var(--font);font-size:15px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:170px;flex:1;cursor:pointer}
  .who{font-size:12.5px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:8px}
  .who .btn{min-height:36px;padding:0 12px;font-size:12.5px}

  /* ---------- Mobile ---------- */
  @media (max-width:768px){
    .app{flex-direction:column}
    .sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;width:100%;flex-direction:row;justify-content:space-around;gap:0;border-right:none;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40;border-radius:0}
    .brand,.side-foot{display:none}
    .nav-btn{flex-direction:column;gap:3px;font-size:11px;padding:8px 4px;border-radius:10px;min-height:auto;flex:1}
    .nav-btn svg{width:21px;height:21px}
    .main{padding-bottom:86px}
    .topbar{padding:12px 16px}
    .topbar .top-logo{width:40px;height:40px}
    .topbar h1{font-size:17px}
    .wrap{padding:16px 14px 0}
    .card{padding:16px 15px}
    .grid2{grid-template-columns:1fr}
    .stats{grid-template-columns:1fr 1fr}
    .tl-row .lab{min-width:54px}
    .login-card{padding:26px 20px}
  }
</style>
</head>
<body>

<!-- ============ 登录页 ============ -->
<div id="login" class="login-mask">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo">
        <img src="logo_clean.png" alt="洗衣机教练">
      </div>
      <div class="txt">成长陪伴平台<small>看见你的每一次成长</small></div>
    </div>
    <div class="field">
      <label>邮箱</label>
      <input type="email" id="lgEmail" placeholder="你的邮箱" autocomplete="username">
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" id="lgPwd" placeholder="登录密码" autocomplete="current-password">
    </div>
    <button class="btn primary" id="lgBtn">登 录</button>
    <div class="login-err" id="lgErr"></div>
    <div class="login-note">数据云端同步 · 仅你与洗衣机教练可见<br>由洗衣机教练陪伴你的每一次成长</div>
  </div>
</div>

<div class="app hidden" id="appRoot">
  <aside class="sidebar">
    <div class="brand">
      <div class="txt">洗衣机教练</div>
    </div>
    <button class="nav-btn active" data-target="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>今日关注
    </button>
    <button class="nav-btn" data-target="timeline">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>对话时间线
    </button>
    <button class="nav-btn" data-target="add" data-type="coach" id="navCoach">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>记录对话

<script>
/* =========================================================
   洗衣机教练 · 客户成长陪伴台 —— Supabase 同步版（零外部库）
   数据走 Supabase REST/Auth API（原生 fetch），RLS 保证客户间隔离。
   配置：把下面的 URL / ANON 换成你项目的值（Settings → API）。
   ========================================================= */
const SUPABASE = {
  URL:  "https://kmqealhiaeemshwlwqwd.supabase.co",
  ANON: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImttcWVhbGhpYWVlbXNod2x3cXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNjAwMTksImV4cCI6MjEwMTYzNjAxOX0.QMv91x5PRboyAmc2dFpDancFwC34ZMBB6PfOixRpZZQ"
};
const COACH_ID = "washer_coach";

/* ---------- 工具 ---------- */
const $=(s)=>document.querySelector(s);
const $$=(s)=>document.querySelectorAll(s);
function esc(s){return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function nl2br(s){return esc(s).replace(/\n/g,"<br>");}
function uid(){return "s_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseDate(s){const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}

/* ---------- 状态 ---------- */
let TOKEN=null, ME=null;          // ME={role,client_id,email}
let CUR_CLIENT="all";             // 教练当前查看的客户；客户视图=自身 client_id
let sessions=[];                  // 当前视图数据
let clientIds=[];                 // 教练已知的全部 client_id（用于下拉提示）
const IS_COACH=()=>ME&&ME.role==="coach";
const HAS_SUP=true;               // Supabase 版固定支持督导（按记录类型区分）

/* ---------- Supabase REST / Auth（纯 fetch，零库） ---------- */
function hd(){return {"apikey":SUPABASE.ANON,"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"};}
async function sbLogin(email,pwd){
  const r=await fetch(SUPABASE.URL+"/auth/v1/token?grant_type=password",{
    method:"POST",headers:{"apikey":SUPABASE.ANON,"Content-Type":"application/json"},
    body:JSON.stringify({email,password:pwd})
  });
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error_description||e.msg||"登录失败，请检查邮箱和密码");}
  return (await r.json()).access_token;
}
async function sbGetUser(){
  const r=await fetch(SUPABASE.URL+"/auth/v1/user",{headers:{"apikey":SUPABASE.ANON,"Authorization":"Bearer "+TOKEN}});
  if(!r.ok)throw new Error("会话已失效");
  return await r.json();
}
function fillClientSelects(){
  const cur=CUR_CLIENT||"all";
  const main=$("#clientSelect");
  let h='<option value="all">全部客户</option>';
  clientIds.forEach(c=>h+='<option value="'+esc(c)+'">'+esc(c)+'</option>');
  if(cur!=="all"&&!clientIds.includes(cur))h+='<option value="'+esc(cur)+'">'+esc(cur)+'</option>';
  main.innerHTML=h;
  main.value=(cur==="all"||clientIds.includes(cur))?cur:"all";
  // 归属客户下拉（自动列出已创建客户）
  const fc=$("#fClient");
  const prev=fc.value;
  let oh='<option value="">— 选择客户 —</option>';
  clientIds.forEach(c=>oh+='<option value="'+esc(c)+'">'+esc(c)+'</option>');
  oh+='<option value="__new__">＋ 新建客户…</option>';
  fc.innerHTML=oh;
  if(clientIds.includes(prev))fc.value=prev;
  else if(CUR_CLIENT&&CUR_CLIENT!=="all"&&clientIds.includes(CUR_CLIENT))fc.value=CUR_CLIENT;
  else if(clientIds.length)fc.value=clientIds[0];
  else fc.value="";
  toggleNewClient();
}
function toggleNewClient(){
  const box=$("#fClientNew");
  if(!box)return;
  const isNew=$("#fClient").value==="__new__";
  box.classList.toggle("hidden",!isNew);
  if(isNew)box.focus();
}
$("#fClient").addEventListener('change',toggleNewClient);
async function sbList(){
  let url=SUPABASE.URL+"/rest/v1/sessions?select=*&order=date.desc";
  if(IS_COACH()){
    if(CUR_CLIENT&&CUR_CLIENT!=="all")url+="&client_id=eq."+encodeURIComponent(CUR_CLIENT);
  }else{
    url+="&client_id=eq."+encodeURIComponent(ME.client_id); // RLS 双保险
  }
  const r=await fetch(url,{headers:hd()});
  if(r.status===401)throw {auth:true};
  if(!r.ok)throw new Error("读取失败");
  const rows=await r.json();
  // 收集教练已知 client_id 并刷新下拉
  if(IS_COACH()){
    const set=new Set(clientIds);
    rows.forEach(x=>x.client_id&&set.add(x.client_id));
    clientIds=[...set];
  }
  return rows;
}
async function sbListClients(){
  // 读客户清单表（优先来源）；表不存在或无权限时返回 null，由上层回退
  if(!IS_COACH())return null;
  const r=await fetch(SUPABASE.URL+"/rest/v1/clients?select=client_id,display_name&order=client_id",{headers:hd()});
  if(!r.ok)return null;
  return await r.json();
}
async function sbInsert(rows){
  const r=await fetch(SUPABASE.URL+"/rest/v1/sessions",{
    method:"POST",headers:{...hd(),"Prefer":"return=representation"},
    body:JSON.stringify(rows)
  });
  if(r.status===401)throw {auth:true};
  if(!r.ok){let m="";try{const j=await r.json();m=j.message||j.hint||"";}catch(e){}throw new Error(m||("保存失败（HTTP "+r.status+"）"));}
  return await r.json();
}
async function sbUpdate(id,rec){
  const r=await fetch(SUPABASE.URL+"/rest/v1/sessions?id=eq."+encodeURIComponent(id),{
    method:"PATCH",headers:hd(),body:JSON.stringify(rec)
  });
  if(r.status===401)throw {auth:true};
  if(!r.ok){let m="";try{const j=await r.json();m=j.message||j.hint||"";}catch(e){}throw new Error(m||("更新失败（HTTP "+r.status+"）"));}
}
async function sbDelete(id){
  const r=await fetch(SUPABASE.URL+"/rest/v1/sessions?id=eq."+encodeURIComponent(id),{
    method:"DELETE",headers:hd()
  });
  if(r.status===401)throw {auth:true};
  if(!r.ok)throw new Error("删除失败");
}
async function sbClearClient(cid){
  const url=SUPABASE.URL+"/rest/v1/sessions?client_id=eq."+encodeURIComponent(cid);
  const r=await fetch(url,{method:"DELETE",headers:hd()});
  if(r.status===401)throw {auth:true};
  if(!r.ok)throw new Error("清空失败");
}

/* ---------- 图标 ---------- */
const ICON={
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-5.3A8 8 0 1 1 21 12z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6L21 9.3l-4.5 4.2 1.1 6L12 17l-5.6 2.5 1.1-6L3 9.3l6.4-.7z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/></svg>'
};
const TYPE_LABEL={coach:"教练对话",supervise:"督导"};

/* ---------- 错误兜底（401 跳登录） ---------- */
function handleErr(e){
  if(e&&e.auth){logout("登录已过期，请重新登录");return true;}
  return false;
}

/* ---------- 今日关注 ---------- */
function renderToday(){
  const el=$("#today");
  const t=todayStr();
  const pending=sessions.filter(s=>s.action&&!s.action_done);
  pending.sort((a,b)=>{
    const ao=(a.action_due&&a.action_due<t)?0:1,bo=(b.action_due&&b.action_due<t)?0:1;
    if(ao!==bo)return ao-bo;
    return (a.action_due||"").localeCompare(b.action_due||"");
  });
  let html='<div class="th">'+ICON.clock+'今日关注<span class="pill">'+(pending.length?pending.length+" 项待行动":"一切顺畅")+'</span></div>';
  if(pending.length===0){
    const last=sessions.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
    html+='<div class="empty">暂时没有待行动的事项。'+(last?('上一次对话是 <b>'+esc(last.date)+'</b> · '+esc(last.topic||last.s_focus||"")+'。'):'记录第一次对话，开始你们的成长轨迹吧。')+'</div>';
  }else{
    pending.forEach(s=>{
      const due=s.action_due||"";
      const overdue=due&&due<t;
      const sup=(s.type||"coach")==="supervise";
      const st=sup?(s.s_focus||""):(s.topic||"");
      const tl=HAS_SUP?'<span style="opacity:.7"> · '+TYPE_LABEL[s.type||"coach"]+'</span>':'';
      const cid=(IS_COACH()&&CUR_CLIENT==="all"&&s.client_id)?'<div class="cid">客户：'+esc(s.client_id)+'</div>':'';
      html+='<div class="td-item'+(overdue?" over":"")+'">'+
        '<div class="ic">'+(overdue?ICON.flag:ICON.chat)+'</div>'+
        '<div class="body"><div class="t">'+esc(st)+tl+'</div>'+
        '<div class="d">'+nl2br(s.action)+'</div>'+
        '<div class="meta">'+(overdue?('已逾期 · 截止 '+esc(due)):('待行动 · '+(due?('截止 '+esc(due)):'无截止日')))+'</div>'+cid+'</div>'+
        '<div class="act"><button class="btn sm" data-done="'+esc(s.id)+'">'+ICON.check+'已完成</button>'+
        '<button class="btn ghost sm" data-edit="'+esc(s.id)+'">'+ICON.edit+'编辑</button></div>'+
      '</div>';
    });
  }
  el.innerHTML=html;
  $$('#today [data-done]').forEach(b=>b.addEventListener('click',()=>markDone(b.dataset.done)));
  $$('#today [data-edit]').forEach(b=>b.addEventListener('click',()=>editSession(b.dataset.edit)));
}
async function markDone(id){
  const s=sessions.find(x=>x.id===id);if(!s)return;
  s.action_done=true;
  try{await sbUpdate(id,{action_done:true});}
  catch(e){if(handleErr(e))return;alert("更新失败，请重试");s.action_done=false;return;}
  renderAll();
}
async function toggleAction(id){
  const s=sessions.find(x=>x.id===id);if(!s)return;
  const nv=!s.action_done;
  s.action_done=nv;
  try{await sbUpdate(id,{action_done:nv});}
  catch(e){if(handleErr(e))return;s.action_done=!nv;alert("更新失败，请重试");return;}
  renderAll();
}

/* ---------- 筛选 ---------- */
let curFilter="all", curYear="all", curMonth="all";
function renderFilters(){
  const box=$("#filters");
  // 教练：仅“全部客户”时显示筛选条
  // 客户：仅当该客户存在督导记录时才显示
  const showForClient=!IS_COACH() && sessions.some(s=>(s.type||"coach")==="supervise");
  if((CUR_CLIENT!=="all"&&IS_COACH())||(!IS_COACH()&&!showForClient)){box.classList.add("hidden");return;}
  box.classList.remove("hidden");
  box.innerHTML='<button data-f="all" class="'+(curFilter==="all"?"on":"")+'">全部</button>'+
    '<button data-f="coach" class="'+(curFilter==="coach"?"on":"")+'">教练对话</button>'+
    '<button data-f="supervise" class="'+(curFilter==="supervise"?"on":"")+'">督导</button>';
  $$('#filters button').forEach(b=>b.addEventListener('click',()=>{curFilter=b.dataset.f;renderFilters();renderTimeline();}));
}
function renderDateNav(){
  const years=[...new Set(sessions.map(s=>s.date.slice(0,4)))].sort().reverse();
  const el=$("#heatGrid");
  if(!years.length){
    el.innerHTML='<div class="mh-inner"><div style="color:var(--muted);font-size:13px">记录第一次对话后，这里会出现按月分布的热力图。</div></div>';
  }else{
    const rows=years.map(y=>{
      const cnt=Array(12).fill(0);
      sessions.forEach(s=>{if(s.date.slice(0,4)===y)cnt[+s.date.slice(5,7)-1]++;});
      const cells=cnt.map((c,i)=>{
        const m=String(i+1).padStart(2,"0");
        const lvl=c===0?"":(c===1?" lvl1":(c<=3?" lvl2":" lvl3"));
        const sel=(y===curYear&&m===curMonth)?" sel":"";
        return '<div class="mh-cell'+lvl+sel+'" data-y="'+y+'" data-m="'+m+'" title="'+esc(y+"年"+(i+1)+"月")+(c?(" · "+c+" 条"):"")+'">'+
          '<span class="mn">'+(i+1)+'月</span>'+(c?'<span class="mc">'+c+'</span>':'')+
        '</div>';
      }).join("");
      return '<div class="mh-row"><div class="mh-yr">'+y+'</div><div class="mh-cells">'+cells+'</div></div>';
    }).join("");
    el.innerHTML='<div class="mh-inner">'+rows+'</div>'+
      '<div class="mh-legend"><span>少</span><i class="s0"></i><i class="s1"></i><i class="s2"></i><i class="s3"></i><span>多</span></div>';
  }
  $$('#heatGrid .mh-cell').forEach(b=>b.addEventListener('click',()=>{
    const y=b.dataset.y,m=b.dataset.m;
    if(curYear===y&&curMonth===m){curYear="all";curMonth="all";}
    else{curYear=y;curMonth=m;}
    renderDateNav();renderTimeline();
  }));
  $("#dnClear").classList.toggle("hidden",curYear==="all"&&curMonth==="all");
}
$("#dnClear").addEventListener('click',()=>{curYear="all";curMonth="all";renderDateNav();renderTimeline();});

/* ---------- 时间线 ---------- */
function renderTimeline(){
  const el=$("#timelineList");
  let list=sessions.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(curFilter!=="all")list=list.filter(s=>(s.type||"coach")===curFilter);
  if(curMonth!=="all")list=list.filter(s=>s.date.slice(0,4)===curYear&&s.date.slice(5,7)===curMonth);
  else if(curYear!=="all")list=list.filter(s=>s.date.slice(0,4)===curYear);
  $("#dnCount").textContent=list.length?("显示 "+list.length+" / "+sessions.length+" 条"):"";
  if(list.length===0){
    const filteredOut=curFilter!=="all"||curYear!=="all"||curMonth!=="all";
    el.innerHTML='<div class="empty-state"><div class="big">这个范围内还没有记录</div>'+(filteredOut?"调整上方筛选条件，或记录一条新对话吧。":"记录第一次对话，开始沉淀成长轨迹。")+'</div>';
    return;
  }
  const canEdit=IS_COACH();
  el.innerHTML='<div class="timeline">'+list.map(s=>{
    const sup=(s.type||"coach")==="supervise";
    const typeBadge='<span class="tl-type '+(sup?"supervise":"coach")+'">'+TYPE_LABEL[s.type||"coach"]+'</span>';
    const cidTag=(IS_COACH()&&CUR_CLIENT==="all"&&s.client_id)?'<span class="tl-cid">'+esc(s.client_id)+'</span>':'';
    const title=sup?(s.s_focus||("督导"+(s.sup_client?(" · "+s.sup_client):""))):(s.topic||"");
    const tags=(s.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join("");
    let bodyRows="";
    if(sup){
      bodyRows+='<div class="tl-row"><span class="lab">督导后反馈</span><span class="val">'+(s.s_feedback?nl2br(s.s_feedback):'<span class="ph">（尚未填写，可在「编辑」中补充）</span>')+'</span></div>';
      if(s.sup_client)bodyRows+='<div class="tl-row"><span class="lab">教练客户</span><span class="val">'+esc(s.sup_client)+'</span></div>';
    }else{
      bodyRows+='<div class="tl-row"><span class="lab">觉察收获</span><span class="val">'+(s.feedback?nl2br(s.feedback):'<span class="ph">（尚未填写，可在「编辑」中补充）</span>')+'</span></div>';
      if(s.eval)bodyRows+='<div class="tl-row"><span class="lab">教练反馈</span><span class="val">'+nl2br(s.eval)+'</span></div>';
    }
    let actionHtml="";
    if(s.action){
      const cls=s.action_done?"done":"pending";
      const toggleBtn=canEdit?('<button class="btn sm act-toggle" data-toggle="'+esc(s.id)+'">'+(s.action_done?"撤销":"标记完成")+'</button>'):'';
      actionHtml='<div class="tl-row act-row '+cls+'"><span class="lab">'+(s.action_done?"已行动":"行动承诺")+'</span><span class="val">'+nl2br(s.action)+'</span>'+toggleBtn+'</div>';
      if(!s.action_done){
        actionHtml+='<div class="tl-row act-row sub"><span class="lab muted">未完成原因</span><span class="val">'+(s.action_block?nl2br(s.action_block):'<span class="ph">（未填写，可在「编辑」中补充）</span>')+'</span></div>';
      }
    }
    // 教练内部提醒：教练对话仅教练可见；督导的"下一步关注重点"客户可见
    let followHtml="";
    if(s.follow&&(IS_COACH()||sup)){
      followHtml='<div class="follow coach-note"><span class="ft">'+(sup?"下一步关注重点":"下次关注")+'</span><span>'+nl2br(s.follow)+'</span>'+(s.plan?'<span class="pd">'+(sup?"下次督导 ":"计划 ")+esc(s.plan)+'</span>':'')+'</div>';
    }
    let testiHtml="";
    if(s.testimonial||!IS_COACH()){
      testiHtml='<div class="follow testimonial"><span class="ft">客户反馈</span><span class="val">'+(s.testimonial?nl2br(s.testimonial):'<span class="ph">（尚未填写，可在「编辑」中补充）</span>')+'</span></div>';
    }
    const actions=(canEdit||!IS_COACH())?('<div class="tl-actions">'+
        '<button class="btn sm" data-edit="'+esc(s.id)+'">'+ICON.edit+'编辑</button>'+
        (canEdit?'<button class="btn sm danger" data-del="'+esc(s.id)+'">'+ICON.trash+'删除</button>':'')+
      '</div>'):"";
    return '<div class="tl-item'+(sup?" sup":"")+'"><div class="tl-card">'+
      '<div class="tl-head"><div class="tl-meta"><span class="tl-date">'+esc(s.date)+'</span>'+typeBadge+cidTag+'</div><span class="tl-topic">'+esc(title)+'</span></div>'+
      bodyRows+
      actionHtml+
      followHtml+
      testiHtml+
      (tags?'<div class="tags">'+tags+'</div>':'')+
      actions+
    '</div></div>';
  }).join("")+'</div>';
  $$('#timelineList [data-edit]').forEach(b=>b.addEventListener('click',()=>editSession(b.dataset.edit)));
  $$('#timelineList [data-del]').forEach(b=>b.addEventListener('click',()=>delSession(b.dataset.del)));
  $$('#timelineList [data-toggle]').forEach(b=>b.addEventListener('click',()=>toggleAction(b.dataset.toggle)));
}

/* 客户可改字段的内联编辑（教练/客户均可） */
function inEditBtn(id,field){
  return '<button class="btn sm fb-edit" data-in="'+esc(id)+'" data-field="'+esc(field)+'">'+ICON.edit+'编辑</button>';
}
async function inlineEdit(id,field){
  const row=document.querySelector('[data-inrow="'+CSS.escape(id)+'-'+CSS.escape(field)+'"]');
  if(!row)return;
  const s=sessions.find(x=>x.id===id);if(!s)return;
  const valEl=row.querySelector('.val');
  if(!valEl){renderTimeline();return;}
  valEl.innerHTML='<textarea style="width:100%;font-size:14.5px;min-height:60px;margin-top:4px;font-family:var(--font)">'+esc(s[field]||"")+'</textarea>'+
    '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm primary" data-insave="'+esc(id)+'" data-field="'+esc(field)+'">'+ICON.check+'保存</button>'+
    '<button class="btn sm ghost" data-incancel="'+esc(id)+'" data-field="'+esc(field)+'">取消</button></div>';
  const eb=row.querySelector('.fb-edit');if(eb)eb.style.visibility='hidden';
  row.querySelector('[data-insave]').addEventListener('click',async()=>{
    const v=row.querySelector('textarea').value;
    const old=s[field];
    s[field]=v;
    try{await sbUpdate(id,{[field]:v});}
    catch(e){if(handleErr(e))return;s[field]=old;alert("保存失败，请重试");renderTimeline();return;}
    renderTimeline();renderOverview();
  });
  row.querySelector('[data-incancel]').addEventListener('click',()=>renderTimeline());
}

/* ---------- 成长概览 ---------- */
function spanText(a,b){
  const days=Math.max(1,Math.round((b-a)/86400000)+1);
  if(days<31)return {num:days,unit:"天"};
  const months=Math.round(days/30.44);
  return {num:months,unit:"个月"};
}
function renderOverview(){
  const el=$("#overviewBody");
  if(sessions.length===0){el.innerHTML='<div class="empty-state"><div class="big">暂无数据</div>记录对话后，这里会出现你的成长数据。</div>';return;}
  const sorted=sessions.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const total=sorted.length;
  const first=parseDate(sorted[0].date),last=parseDate(sorted[sorted.length-1].date);
  const span=spanText(first,last);
  const actDone=sorted.filter(s=>s.action&&s.action_done).length;
  const c=sessions.filter(s=>(s.type||"coach")==="coach").length;
  const sp=total-c;

  let html='<div class="stats">'+
    '<div class="stat"><div class="n">'+c+'</div><div class="l">教练对话</div></div>'+
    (sp>0?'<div class="stat"><div class="n">'+sp+'</div><div class="l">督导</div></div>':'')+
    '<div class="stat"><div class="n">'+span.num+'<span class="unit">'+span.unit+'</span></div><div class="l">陪伴</div></div>'+
    '<div class="stat"><div class="n">'+actDone+'</div><div class="l">已行动承诺</div></div>'+
  '</div>';

  const freq={};
  const seen=new Set();
  sorted.forEach(s=>{
    seen.clear();
    (s.tags||[]).forEach(t=>{
      if(seen.has(t))return; seen.add(t);   // 单条对话内去重，避免手滑重复填词被重复计数
      freq[t]=(freq[t]||0)+1;
    });
  });
  // 覆盖全部历史对话的关键词，按频次从高到低完整呈现（不再截断 Top8）
  const arr=Object.entries(freq).sort((a,b)=>b[1]-a[1]);
  if(arr.length){
    html+='<div class="ov-block"><div class="ttl">'+ICON.star+'成长关键词（按出现频次）</div><div class="kw-wrap">';
    arr.forEach(([name,c])=>{
      html+='<span class="kw">'+esc(name)+'<b>'+c+'</b></span>';
    });
    html+='</div></div>';
  }
  el.innerHTML=html;
}

let pickedType="coach";
function setType(t){

  const sup=t==="supervise";

$$('#typePick button').forEach(b=>b.addEventListener('click',()=>setType(b.dataset.t)));

function resetForm(){
  $("#sessionForm").reset();$("#editId").value="";setType("coach");
  $("#fDate").value=todayStr();
  if(IS_COACH()){
    const fc=$("#fClient");
    if(CUR_CLIENT&&CUR_CLIENT!=="all"&&fc.querySelector('option[value="'+CUR_CLIENT+'"]'))fc.value=CUR_CLIENT;
    else if(clientIds.length)fc.value=clientIds[0];
    else fc.value="";
    $("#fClientNew").value="";
    toggleNewClient();
  }
  $("#btnSubmit").textContent="保存对话";$("#btnCancel").classList.add("hidden");
  $("#formSub").textContent="填写本次对话的核心内容，保存后会出现在时间线最上方";
  if(!IS_COACH())$("#add").classList.add("hidden");
}
$("#btnCancel").addEventListener('click',resetForm);

function editSession(id){
  const s=sessions.find(x=>x.id===id);if(!s)return;
  const sup=(s.type||"coach")==="supervise";
  $("#editId").value=s.id;
  setType(sup?"supervise":"coach");
  if(IS_COACH()){
    $("#sessionForm").classList.remove("client-mode");
    $("#fDate").value=s.date;
    const cid=s.client_id||"";
    const fc=$("#fClient");
    if(cid&&!fc.querySelector('option[value="'+cid+'"]')){
      const o=document.createElement("option");o.value=cid;o.textContent=cid;
      const anchor=fc.querySelector('option[value="__new__"]');
      anchor?fc.insertBefore(o,anchor):fc.appendChild(o);
    }
    fc.value=cid;
    $("#fClientNew").value="";
    toggleNewClient();
    $("#fFollow").value=s.follow||"";
    $("#fPlan").value=s.plan||"";
    if(sup){$("#fSupFeedback").value=s.s_feedback||"";$("#fSupClient").value=s.sup_client||"";}
    else{
      $("#fTopic").value=s.topic||"";
      $("#fFeedback").value=s.feedback||"";
      $("#fEval").value=s.eval||"";
      $("#fAction").value=s.action||"";
      $("#fActionBlock").value=s.action_block||"";
      $("#fActionDue").value=s.action_due||"";
      $("#fTestimonial").value=s.testimonial||"";
      $("#fTags").value=(s.tags||[]).join(", ");
    }
    $("#btnSubmit").textContent="保存修改";$("#btnCancel").classList.remove("hidden");
    $("#formSub").textContent="正在编辑：「"+(sup?"":(s.topic||""))+"」";
    goTarget("add");
  }else{
    // 客户视图：只显示客户可编辑字段（觉察收获 / 未完成原因 / 督导后反馈 / 客户反馈）
    $("#sessionForm").classList.add("client-mode");
    $("#fFeedback").value=s.feedback||"";
    $("#fActionBlock").value=s.action_block||"";
    $("#fTestimonial").value=s.testimonial||"";
    if(sup)$("#fSupFeedback").value=s.s_feedback||"";
    $("#btnSubmit").textContent="保存反馈";$("#btnCancel").classList.remove("hidden");
    $("#formSub").textContent="补充或修改你在这次对话中的反馈内容";
    $("#add").classList.remove("hidden");
    goTarget("add");
  }
}

$("#sessionForm").addEventListener('submit',async e=>{
  e.preventDefault();
  if(!IS_COACH()){
    const id=$("#editId").value;
    if(!id){alert("客户无法直接新增对话，反馈可在下方卡片的「编辑」按钮补充");return;}
    const s=sessions.find(x=>x.id===id);
    const rec={};
    if((s.type||"coach")==="supervise"){ rec.s_feedback=$("#fSupFeedback").value.trim(); }
    else { rec.feedback=$("#fFeedback").value.trim(); rec.action_block=$("#fActionBlock").value.trim(); rec.testimonial=$("#fTestimonial").value.trim(); }
    try{ await sbUpdate(id,rec); }
    catch(err){ if(handleErr(err))return; alert(err.message||"保存失败，请重试"); return; }
    $("#add").classList.add("hidden");
    resetForm(); await reload(); goTarget("timeline"); return;
  }
  const isSup=pickedType==="supervise";
  if(!isSup){if(!$("#fTopic").value.trim()){alert("请填写对话主题");return;}}
  const isNewClient=$("#fClient").value==="__new__";
  const cid=isNewClient?$("#fClientNew").value.trim():$("#fClient").value;
  if(!cid){alert("请选择或填写归属客户");return;}
  const rec={
    client_id:cid, coach_id:COACH_ID,
    date:$("#fDate").value||todayStr(),
    type:isSup?"supervise":"coach",
    follow:$("#fFollow").value.trim(),
    plan:$("#fPlan").value||null,
    action_done:$("#editId").value?(sessions.find(x=>x.id===$("#editId").value)?.action_done??false):false
  };
  if(isSup){
    rec.s_feedback=$("#fSupFeedback").value.trim();
    rec.sup_client=$("#fSupClient").value.trim();
  }else{
    rec.topic=$("#fTopic").value.trim();
    rec.feedback=$("#fFeedback").value.trim();
    rec.eval=$("#fEval").value.trim();
    rec.action=$("#fAction").value.trim();
    rec.action_block=$("#fActionBlock").value.trim();
    rec.action_due=$("#fActionDue").value||null;
    rec.testimonial=$("#fTestimonial").value.trim();
    rec.tags=$("#fTags").value.split(/[,，\s]+/).map(t=>t.trim()).filter(Boolean);
  }
  const id=$("#editId").value;
  try{
    if(id){await sbUpdate(id,rec);}
    else{await sbInsert([rec]);}
  }catch(err){if(handleErr(err))return;alert(err.message||"保存失败，请重试");return;}
  CUR_CLIENT=cid;
  resetForm();await reload();goTarget("timeline");
});

/* ---------- 删除 ---------- */
function delSession(id){
  const s=sessions.find(x=>x.id===id);if(!s)return;
  const sup=(s.type||"coach")==="supervise";
  const st=sup?(s.s_focus||""):(s.topic||"");
  showModal("删除这条对话？","「"+st+"（"+s.date+"）」将被永久删除，无法恢复。",async()=>{
    try{await sbDelete(id);}
    catch(e){if(handleErr(e))return;alert("删除失败");return;}
    await reload();
  });
}

$("#btnImport").addEventListener('click',()=>$("#fileInput").click());
$("#fileInput").addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.sessions))throw 0;
      const cid=IS_COACH()?(CUR_CLIENT&&CUR_CLIENT!=="all"?CUR_CLIENT:""):ME.client_id;
      const rows=d.sessions.map(x=>({
        id:x.id,
        client_id:cid||x.client_id||CUR_CLIENT||"unknown",
        coach_id:COACH_ID,
        date:x.date||todayStr(),
        type:x.type||"coach",
        topic:x.topic||"",feedback:x.feedback||"",eval:x.eval||"",tags:x.tags||[],
        action:x.action||"",action_block:x.action_block||"",testimonial:x.testimonial||"",
        s_focus:x.s_focus||"",s_feedback:x.s_feedback||"",sup_client:x.sup_client||"",
        follow:x.follow||"",plan:x.plan||null,action_done:!!x.action_done
      }));
      if(rows.length===0)throw 0;
      try{await sbInsert(rows);}
      catch(err){if(handleErr(err))return;alert("导入失败："+(err.message||"写入错误"));return;}
      alert("已导入 "+rows.length+" 条对话记录");
      await reload();
    }catch(err){alert("导入失败：文件格式不正确");}
    e.target.value="";
  };
  r.readAsText(f);
});
$("#btnClear").addEventListener('click',()=>{
  const cid=IS_COACH()?(CUR_CLIENT&&CUR_CLIENT!=="all"?CUR_CLIENT:""):ME.client_id;
  if(!cid){alert("全量清空需先切换到某个具体客户");return;}
  showModal("清空该客户全部数据？","将永久删除客户「"+cid+"」的 "+sessions.length+" 条记录，无法恢复。建议先「导出」备份。",async()=>{
    try{await sbClearClient(cid);}
    catch(e){if(handleErr(e))return;alert("清空失败");return;}
    CUR_CLIENT="all";await reload();
  });
});

/* ---------- 客户切换（教练） ---------- */
$("#clientSelect").addEventListener('change',()=>{
  CUR_CLIENT=$("#clientSelect").value;
  curFilter="all";curYear="all";curMonth="all";
  reload();
});

/* ---------- 弹窗 ---------- */
let modalCb=null;
function showModal(title,text,cb){$("#modalTitle").textContent=title;$("#modalText").textContent=text;modalCb=cb;$("#modal").classList.add("show");}
$("#modalCancel").addEventListener('click',()=>{$("#modal").classList.remove("show");modalCb=null;});
$("#modalOk").addEventListener('click',()=>{$("#modal").classList.remove("show");const cb=modalCb;modalCb=null;if(cb)cb();});

/* ---------- 导航 ---------- */
function goTarget(id,btn){const sec=document.getElementById(id);if(sec)sec.scrollIntoView({behavior:"smooth",block:"start"});$$('.nav-btn').forEach(b=>b.classList.toggle('active',btn?b===btn:b.dataset.target===id));}
$$('.nav-btn').forEach(b=>b.addEventListener('click',()=>{
  const t=b.dataset.target;
  if(t==="add" && HAS_SUP && b.dataset.type) setType(b.dataset.type);
  goTarget(t,b);
}));

/* ---------- 登录 / 登出 ---------- */
function applyRoleUI(){
  const coach=IS_COACH();
  $("#navCoach").classList.toggle("hidden",!coach);
  $("#navSup").classList.toggle("hidden",!coach);
  $("#add").classList.toggle("hidden",!coach);
  $("#clientBar").classList.toggle("hidden",!coach);
  $("#btnImport").classList.toggle("hidden",!coach);
  $("#btnClear").classList.toggle("hidden",!coach);
  $("#addClientField").classList.toggle("hidden",!coach);
}
async function reload(){
  try{
    sessions=await sbList();
  }catch(e){
    if(handleErr(e))return;
    sessions=[];
    $("#timelineList").innerHTML='<div class="empty-state"><div class="big">加载失败</div>网络异常或权限不足，请重试。</div>';
  }
  // 客户清单：优先读 clients 表（Supabase 里建的客户），sessions 收集作兜底
  if(IS_COACH()){
    try{
      const clients=await sbListClients();
      if(clients&&clients.length){
        const set=new Set(clientIds);
        clients.forEach(c=>c.client_id&&set.add(c.client_id));
        clientIds=[...set];
      }
    }catch(e){}
    fillClientSelects();
  }
  renderAll();
}
async function doLogin(email,pwd){
  $("#lgErr").textContent="";
  try{
    TOKEN=await sbLogin(email,pwd);
    const u=await sbGetUser();
    ME={role:u.user_metadata&&u.user_metadata.role||"client",
        client_id:u.user_metadata&&u.user_metadata.client_id||"",
        email:u.email};
    localStorage.setItem("wb_sb_token",TOKEN);
    localStorage.setItem("wb_sb_me",JSON.stringify(ME));
    enterApp();
  }catch(e){
    $("#lgErr").textContent=e.message||"登录失败";
  }
}
function enterApp(){
  $("#login").classList.add("hidden");
  $("#appRoot").classList.remove("hidden");
  applyRoleUI();
  reload();
}
function logout(msg){
  TOKEN=null;ME=null;sessions=[];
  localStorage.removeItem("wb_sb_token");localStorage.removeItem("wb_sb_me");
  $("#appRoot").classList.add("hidden");
  $("#login").classList.remove("hidden");
  if(msg)$("#lgErr").textContent=msg;
}
$("#lgBtn").addEventListener('click',()=>{
  const e=$("#lgEmail").value.trim(),p=$("#lgPwd").value;
  if(!e||!p){$("#lgErr").textContent="请填写邮箱和密码";return;}
  doLogin(e,p);
});
$("#lgPwd").addEventListener('keydown',e=>{if(e.key==="Enter")$("#lgBtn").click();});
$("#btnLogout").addEventListener('click',()=>logout());
$("#btnPwd").addEventListener('click',()=>{
  $("#pwNew").value="";$("#pwConfirm").value="";$("#pwErr").textContent="";
  $("#pwdModal").classList.add("show");
});
$("#pwCancel").addEventListener('click',()=>$("#pwdModal").classList.remove("show"));
$("#pwdModal").addEventListener('click',e=>{if(e.target.id==="pwdModal")$("#pwdModal").classList.remove("show");});
$("#pwSave").addEventListener('click',async()=>{
  const np=$("#pwNew").value,cp=$("#pwConfirm").value;
  $("#pwErr").textContent="";
  if(np.length<6){$("#pwErr").textContent="密码至少 6 位";return;}
  if(np!==cp){$("#pwErr").textContent="两次输入不一致";return;}
  const btn=$("#pwSave");btn.disabled=true;btn.textContent="保存中…";
  try{
    const r=await fetch(SUPABASE.URL+"/auth/v1/user",{method:"PATCH",headers:hd(),body:JSON.stringify({password:np})});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.msg||j.message||("修改失败（"+r.status+"）"));}
    $("#pwdModal").classList.remove("show");
    alert("密码已更新，下次登录请使用新密码。");
  }catch(e){
    $("#pwErr").textContent=e.message||"修改失败，请重试";
  }finally{
    btn.disabled=false;btn.textContent="保存新密码";
  }
});

/* ---------- 初始化 ---------- */
(function init(){
  TOKEN=localStorage.getItem("wb_sb_token");
  const meStr=localStorage.getItem("wb_sb_me");
  if(TOKEN&&meStr){
    try{ME=JSON.parse(meStr);}catch(e){ME=null;}
    if(ME){
      // 验证 token 仍有效
      sbGetUser().then(()=>enterApp()).catch(()=>logout("登录已过期，请重新登录"));
      return;
    }
  }
  // 未登录：显示登录页
  $("#appRoot").classList.add("hidden");
})();
</script>
</body>
</html>
